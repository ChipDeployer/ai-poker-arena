version: '3.8'

services:
  poker-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poker-frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - poker-backend

  poker-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poker-backend
    ports:
      - "8080:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DB_PATH=/app/data/poker.db
    restart: always
    volumes:
      - poker_data:/app/data

volumes:
  poker_data: